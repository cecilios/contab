[project]
name = "contab"
version = "0.2.0"
description = "Gestión y conciliación contable de inmuebles"
requires-python = ">=3.13"

dependencies = [
    "Flask",
    "SQLAlchemy",
    "Alembic",
    "waitress",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
contab = "contab.cli:main"
contab-db = "contab.db_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
contab = [
    "templates/*.html",
    "static/**/*",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
]
"contab.contabilidad" = [
    "templates/contabilidad/*.html",
]
"contab.contratos" = [
    "templates/contratos/*.html",
]
"contab.inmuebles" = [
    "templates/inmuebles/*.html",
]
"contab.inquilinos" = [
    "templates/inquilinos/*.html",
]


