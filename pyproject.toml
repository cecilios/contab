[project]
name = "contab"
version = "1.4.1a"
description = "Gestión y conciliación contable de inmuebles"
requires-python = ">=3.13,<3.14"

dependencies = [
    "Flask>=3.1,<3.2",
    "SQLAlchemy>=2.0,<2.1",
    "Alembic>=1.19,<1.20",
    "waitress>=3.0,<3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<9.2",
]

[project.scripts]
contab = "contab.cli:main"
contab-db = "contab.db_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
contab = [
    "templates/*.html",
    "static/**/*",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
]
"contab.conciliacion" = [
    "templates/conciliacion/*.html",
]
"contab.contabilidad" = [
    "templates/contabilidad/*.html",
]
"contab.contratos" = [
    "templates/contratos/*.html",
]
"contab.facturacion" = [
    "templates/facturacion/*.html",
]
"contab.informes" = [
    "templates/informes/*.html",
]
"contab.inmuebles" = [
    "templates/inmuebles/*.html",
]
"contab.inquilinos" = [
    "templates/inquilinos/*.html",
]
