
{% extends "base.html" %}

{% block title %}{{ titulo }} - Contab{% endblock %}

{% block content %}
    <h1 class="formulario-inquilino__titulo">
        {{ titulo }}
    </h1>

    <p class="required-note formulario-inquilino__nota-obligatorios">
        Los campos marcados con (*) son obligatorios.
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" class="formulario-inquilino">

        <div class="form-fila">

            <p class="form-field formulario-inquilino__nombre">
                <label for="nombre">Nombre (*)</label>
                <input
                    id="nombre"
                    name="nombre"
                    value="{{ datos.get('nombre', '') }}"
                >
            </p>

            <p class="form-field formulario-inquilino__nif">
                <label for="nif">NIF (*)</label>
                <input
                    id="nif"
                    name="nif"
                    value="{{ datos.get('nif', '') }}"
                >
            </p>

        </div>

        <fieldset>
            <legend>Domicilio</legend>

            <div class="form-fila">

                <p class="form-field formulario-inquilino__direccion">
                    <label for="direccion">Dirección</label>
                    <input
                        id="direccion"
                        name="direccion"
                        value="{{ datos.get('direccion', '') }}"
                    >
                </p>

            </div>

            <div class="form-fila">

                <p class="form-field">
                    <label for="codigo_postal">Código postal</label>
                    <input
                        id="codigo_postal"
                        name="codigo_postal"
                        class="campo-codigo-postal"
                        value="{{ datos.get('codigo_postal', '') }}"
                    >
                </p>

                <p class="form-field formulario-inquilino__poblacion">
                    <label for="poblacion">Población</label>
                    <input
                        id="poblacion"
                        name="poblacion"
                        value="{{ datos.get('poblacion', '') }}"
                    >
                </p>

                <p class="form-field formulario-inquilino__provincia">
                    <label for="provincia">Provincia</label>
                    <input
                        id="provincia"
                        name="provincia"
                        value="{{ datos.get('provincia', '') }}"
                    >
                </p>

            </div>

        </fieldset>

        <div class="form-fila">

            <p class="form-field formulario-inquilino__email">
                <label for="email">Correo electrónico</label>
                <input
                    id="email"
                    name="email"
                    value="{{ datos.get('email', '') }}"
                >
            </p>

            <p class="form-field formulario-inquilino__telefono">
                <label for="telefono">Teléfono</label>
                <input
                    id="telefono"
                    name="telefono"
                    value="{{ datos.get('telefono', '') }}"
                >
            </p>

        </div>

        <div class="form-fila">

            <p class="form-field formulario-inquilino__notas">
                <label for="notas">Notas</label>
                <textarea
                    id="notas"
                    name="notas"
                >{{ datos.get('notas', '') }}</textarea>
            </p>

        </div>

        <p class="form-actions formulario-inquilino__acciones">
            <button type="submit">Guardar</button>
            <a href="{{ url_for('inquilinos.listar_inquilinos') }}">
                Cancelar
            </a>
        </p>

    </form>
{% endblock %}
