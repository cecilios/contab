<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Inmuebles - Contab</title>
</head>
<body>
    <header>
        <p>
            Contab —
            Base activa: <strong>{{ database_name }}</strong>
            |
            <a href="/">Cambiar base de datos</a>
        </p>
    </header>
    <h1>Inmuebles</h1>
    <p><a href="{{ url_for('inmuebles.nuevo_inmueble') }}">Nuevo inmueble</a></p>

    {% if inmuebles %}
        <ul>
        {% for inmueble in inmuebles %}
            <li>
                {{ inmueble.referencia }} -
                {{ inmueble.descripcion }}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No hay inmuebles registrados.</p>
    {% endif %}

    <p><a href="/">Volver al inicio</a></p>
</body>
</html>
