{% extends "base.html" %}

{% block title %}Nuevo inmueble - Contab{% endblock %}

{% block content %}
	<h1>{{ titulo }}</h1>
	
    <p class="required-note">
        Los campos marcados con (*) son obligatorios.
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <p class="form-field">
            <label for="referencia">Referencia (*)</label>
            <input
                id="referencia"
                name="referencia"
                value="{{ datos.get('referencia', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="codigo_facturacion">Código de facturación (*)</label>
            <input
                id="codigo_facturacion"
                name="codigo_facturacion"
                value="{{ datos.get('codigo_facturacion', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="descripcion">Descripción (*)</label>
            <input
                id="descripcion"
                name="descripcion"
                value="{{ datos.get('descripcion', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="direccion">Dirección (*)</label>
            <input
                id="direccion"
                name="direccion"
                value="{{ datos.get('direccion', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="codigo_postal">Código postal</label>
            <input
                id="codigo_postal"
                name="codigo_postal"
                value="{{ datos.get('codigo_postal', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="poblacion">Población (*)</label>
            <input
                id="poblacion"
                name="poblacion"
                value="{{ datos.get('poblacion', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="provincia">Provincia (*)</label>
            <input
                id="provincia"
                name="provincia"
                value="{{ datos.get('provincia', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="ref_catastral">Referencia catastral</label>
            <input
                id="ref_catastral"
                name="ref_catastral"
                value="{{ datos.get('ref_catastral', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="seguro">Seguro</label>
            <input
                id="seguro"
                name="seguro"
                value="{{ datos.get('seguro', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="participacion">Participación (%) (*)</label>
            <input
                id="participacion"
                name="participacion"
                value="{{ datos.get('participacion', '100,00') }}"
            >
        </p>

        <p class="form-field">
            <label for="notas">Notas</label>
            <textarea
                id="notas"
                name="notas"
            >{{ datos.get('notas', '') }}</textarea>
        </p>

        <p class="form-actions">
            <button type="submit">Guardar</button>
            <a href="{{ url_for('inmuebles.listar_inmuebles') }}">
                Cancelar
            </a>
        </p>
    </form>
{% endblock %}
