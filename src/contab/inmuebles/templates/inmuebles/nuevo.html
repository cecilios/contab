<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Nuevo inmueble - Contab</title>
</head>
<body>
    <h1>Nuevo inmueble</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        <p>
            <label>Referencia<br>
                <input name="referencia" value="{{ datos.get('referencia', '') }}">
            </label>
        </p>

        <p>
            <label>Código de facturación<br>
                <input name="codigo_facturacion"
                       value="{{ datos.get('codigo_facturacion', '') }}">
            </label>
        </p>

        <p>
            <label>Descripción<br>
                <input name="descripcion" value="{{ datos.get('descripcion', '') }}">
            </label>
        </p>

        <p>
            <label>Dirección<br>
                <input name="direccion" value="{{ datos.get('direccion', '') }}">
            </label>
        </p>

        <p>
            <label>Código postal<br>
                <input name="codigo_postal"
                       value="{{ datos.get('codigo_postal', '') }}">
            </label>
        </p>

        <p>
            <label>Población<br>
                <input name="poblacion" value="{{ datos.get('poblacion', '') }}">
            </label>
        </p>

        <p>
            <label>Provincia<br>
                <input name="provincia" value="{{ datos.get('provincia', '') }}">
            </label>
        </p>

        <p>
            <label>Referencia catastral<br>
                <input name="ref_catastral"
                       value="{{ datos.get('ref_catastral', '') }}">
            </label>
        </p>

        <p>
            <label>Seguro<br>
                <input name="seguro" value="{{ datos.get('seguro', '') }}">
            </label>
        </p>

        <p>
            <label>Participación (%)<br>
                <input name="participacion"
                       value="{{ datos.get('participacion', '100,00') }}">
            </label>
        </p>

        <p>
            <label>Notas<br>
                <textarea name="notas">{{ datos.get('notas', '') }}</textarea>
            </label>
        </p>

        <p>
            <button type="submit">Guardar</button>
            <a href="/inmuebles/">Cancelar</a>
        </p>
    </form>
</body>
</html>
