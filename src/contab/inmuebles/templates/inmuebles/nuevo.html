{% extends "base.html" %}

{% block title %}Nuevo inmueble - Contab{% endblock %}

{% block content %}
	<h1>{{ titulo }}</h1>
	
    <p class="required-note">
        Los campos marcados con (*) son obligatorios.
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <p class="form-field">
            <label for="tipo">Tipo (*)</label>
            <select id="tipo" name="tipo">
                <option value="">Seleccione...</option>

                {% for valor, etiqueta in tipos_inmueble.items() %}
                    <option
                        value="{{ valor }}"
                        {% if datos.get("tipo") == valor %}
                            selected
                        {% endif %}
                    >
                        {{ etiqueta }}
                    </option>
                {% endfor %}
            </select>
        </p>
        <p class="form-field">
            <label for="referencia">Referencia (*)</label>
            <input
                id="referencia"
                name="referencia"
                value="{{ datos.get('referencia', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="codigo_facturacion">Código de facturación (*)</label>
            <input
                id="codigo_facturacion"
                name="codigo_facturacion"
                value="{{ datos.get('codigo_facturacion', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="descripcion">Descripción (*)</label>
            <input
                id="descripcion"
                name="descripcion"
                value="{{ datos.get('descripcion', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="direccion">Dirección (*)</label>
            <input
                id="direccion"
                name="direccion"
                value="{{ datos.get('direccion', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="codigo_postal">Código postal</label>
            <input
                id="codigo_postal"
                name="codigo_postal"
                value="{{ datos.get('codigo_postal', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="poblacion">Población (*)</label>
            <input
                id="poblacion"
                name="poblacion"
                value="{{ datos.get('poblacion', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="provincia">Provincia (*)</label>
            <input
                id="provincia"
                name="provincia"
                value="{{ datos.get('provincia', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="ref_catastral">Referencia catastral</label>
            <input
                id="ref_catastral"
                name="ref_catastral"
                value="{{ datos.get('ref_catastral', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="seguro">Seguro</label>
            <input
                id="seguro"
                name="seguro"
                value="{{ datos.get('seguro', '') }}"
            >
        </p>

        <p class="form-field">
            <label for="participacion">Participación (%) (*)</label>
            <input
                id="participacion"
                name="participacion"
                value="{{ datos.get('participacion', '100,00') }}"
            >
        </p>

        <fieldset>
            <legend>Relación con inmueble subdividido</legend>

            <p class="form-field checkbox-field">
                <label>
                    <input
                        id="es_parte_inmueble"
                        type="checkbox"
                        name="es_parte_inmueble"
                        {% if datos.get("es_parte_inmueble") %}
                            checked
                        {% endif %}
                    >
                    Es parte de un inmueble
                </label>
            </p>

            <p
                id="campo_inmueble_padre"
                class="form-field"
            >
                <label for="inmueble_padre_id">
                    Inmueble total
                </label>

                <select
                    id="inmueble_padre_id"
                    name="inmueble_padre_id"
                >
                    <option value="">
                        Seleccione un inmueble subdividido
                    </option>

                    {% for inmueble_total in inmuebles_subdivididos %}
                        <option
                            value="{{ inmueble_total.id }}"
                            {% if datos.get("inmueble_padre_id")|string == inmueble_total.id|string %}
                                selected
                            {% endif %}
                        >
                            {{ inmueble_total.referencia }} -
                            {{ inmueble_total.descripcion }}
                        </option>
                    {% endfor %}
                </select>
            </p>
        </fieldset>

        <p class="form-field">
            <label for="notas">Notas</label>
            <textarea
                id="notas"
                name="notas"
            >{{ datos.get('notas', '') }}</textarea>
        </p>

        <p class="form-actions">
            <button type="submit">Guardar</button>
            <a href="{{ url_for('inmuebles.listar_inmuebles') }}">
                Cancelar
            </a>
        </p>
    </form>
{% endblock %}

<script>
    const esParte = document.getElementById(
        "es_parte_inmueble"
    );
    const campoPadre = document.getElementById(
        "campo_inmueble_padre"
    );
    const selectorPadre = document.getElementById(
        "inmueble_padre_id"
    );

    function actualizarInmueblePadre() {
        const visible = esParte.checked;

        campoPadre.hidden = !visible;
        selectorPadre.disabled = !visible;

        if (!visible) {
            selectorPadre.value = "";
        }
    }

    esParte.addEventListener(
        "change",
        actualizarInmueblePadre
    );

    actualizarInmueblePadre();
</script>
